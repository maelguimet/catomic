name: File size

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - run: scripts/check-file-size.test.sh
      - run: scripts/check-file-size --all
      - name: Baseline and exemptions only shrink
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-file-size --against "origin/$BASE_REF"
